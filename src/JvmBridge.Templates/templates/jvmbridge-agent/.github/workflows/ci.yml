name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: win-x64, runner: windows-latest }
          - { rid: osx-arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Prepare the NativeAOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld zlib1g-dev
      # Links the Linux agent against the Ubuntu 18.04 sysroot of .NET's cross-build image, so that it loads on glibc 2.17 and later instead of
      # needing the runner's glibc (2.34 and later on ubuntu-24.04). Renovate updates the pinned commit when void-community/Actions changes.
      - name: Prepare the glibc 2.17 sysroot
        id: sysroot
        if: runner.os == 'Linux'
        uses: void-community/actions/glibc-sysroot@41520889fe56b5801b162b55235c9f589a0c1249 # main
        with:
          rid: ${{ matrix.rid }}
      - name: Publish the agent library and its jar
        run: dotnet publish MyJvmAgent.csproj -c Release -r ${{ matrix.rid }} --self-contained ${{ steps.sysroot.outputs.properties }} -o artifacts/agent/${{ matrix.rid }}
      # Runs the patch tests, then the JVM tests against the agent on every JDK they list, through -agentpath and through the jar.
      - name: Test
        run: dotnet test tests/MyJvmAgent.Tests -c Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-${{ matrix.rid }}
          path: artifacts/agent/${{ matrix.rid }}/MyJvmAgent.*
          if-no-files-found: error

  release:
    name: Attach the agents to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-*
          path: agents
      # Each platform's publish wrote a jar for that platform. The JvmBridge package of the project combines them into one, so there is no tool to install or keep in step with the package.
      - name: Combine the jars of the platforms into one
        run: dotnet msbuild MyJvmAgent.csproj -restore -t:JvmBridgeMergeAgentJars -p:JvmBridgeAgentJars="agents/agent-*/MyJvmAgent.jar" -p:JvmBridgeAgentJarOutput=MyJvmAgent.jar
      - name: Create the release with the jar and an archive per platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for directory in agents/agent-*; do
            rid="${directory#agents/agent-}"
            (cd "$directory" && zip -r "../../MyJvmAgent-$rid.zip" .)
          done
          gh release create "${{ github.ref_name }}" MyJvmAgent.jar MyJvmAgent-*.zip --repo "${{ github.repository }}" --generate-notes
