name: Native JVM Tests
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      timestamp:
        type: string
        required: true
jobs:
  # The targets that build or run an agent, as Compatibility.cs in src/JvmBridge.Build lists them; WorkflowMatrixTests fails when the two differ.
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: linux-arm
            runner: ubuntu-24.04-arm
            container: mcr.microsoft.com/dotnet/runtime-deps:10.0.11-noble@sha256:7c9ba479f4a74450a89726851c2af2b096f9bcc70a71b84ac0302869871ff4c5
            crossContainer: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm@sha256:eb77bde7194de32ed305bf62306073464995651a01c8813337d638e223be498c
          - rid: linux-musl-x64
            runner: ubuntu-24.04
            container: mcr.microsoft.com/dotnet/sdk:10.0.400-alpine3.23@sha256:b36516b249f0cccf9e5017082f51d4bda2d61469f205a7167fbf3b8498ecdd59
          - rid: linux-musl-arm64
            runner: ubuntu-24.04-arm
            container: mcr.microsoft.com/dotnet/sdk:10.0.400-alpine3.23@sha256:b36516b249f0cccf9e5017082f51d4bda2d61469f205a7167fbf3b8498ecdd59
          - rid: linux-musl-arm
            runner: ubuntu-24.04
            crossContainer: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net10.0-cross-arm-alpine@sha256:a295314210c0f21f8e7f37fb4510a3d14b8f54991a702cde92b532298c4c6826
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: win-x86
            runner: windows-2025
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      TARGET_RID: ${{ matrix.rid }}
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.403
            11.0.100-rc.3.26522.148
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fixtures
          path: artifacts/fixtures
      - name: Prepare Linux native toolchain
        if: runner.os == 'Linux' && !matrix.container
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld build-essential zlib1g-dev
      # The agent is linked against .NET's Ubuntu 18.04 sysroot, as agent authors are told to, so every JVM test runs it and GlibcFloorTests holds its glibc floor.
      - name: Prepare the glibc 2.17 sysroot
        id: sysroot
        if: (matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64') && !matrix.container
        uses: void-community/actions/glibc-sysroot@4daadfeeba28a2b06f827a1af46facc2fe016d46 # main
        with:
          rid: ${{ matrix.rid }}
      - name: Prepare Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $architecture = if ($env:TARGET_RID -eq 'win-x86') { 'x64_x86' } elseif ($env:TARGET_RID -eq 'win-arm64') { 'arm64' } else { 'x64' }
          cmd /c "`"$installation\VC\Auxiliary\Build\vcvarsall.bat`" $architecture && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Publish and execute the complete target matrix
        if: '!matrix.container && !matrix.crossContainer'
        shell: bash
        env:
          SYSROOT_PROPERTIES: ${{ steps.sysroot.outputs.properties }}
          JVMBRIDGE_GLIBC_IMAGE: ${{ steps.sysroot.outputs.properties != '' && 'centos:7@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4' || '' }}
        run: |
          compiler=cc
          if [[ "$RUNNER_OS" == Windows ]]; then compiler=cl; fi
          if [[ "$TARGET_RID" == linux-arm ]]; then compiler=arm-linux-gnueabihf-gcc; fi
          # SYSROOT_PROPERTIES is empty except for linux-x64 and linux-arm64, and is meant to split into separate arguments.
          # shellcheck disable=SC2086
          dotnet publish samples/HelloAgent -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" $SYSROOT_PROPERTIES -o "artifacts/agent/$TARGET_RID"
          dotnet publish samples/JavaHost -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -o "artifacts/host/$TARGET_RID"
          # vcvarsall sets Platform=x86 for the native compiler; the managed test host must use the runner's .NET architecture.
          NATIVE_COMPILER="$compiler" dotnet test tests/JvmBridge.IntegrationTests -c Release -p:Platform=AnyCPU --logger trx --results-directory "artifacts/results/$TARGET_RID"
      - name: Publish self-contained ARM32 xUnit tests
        if: matrix.rid == 'linux-arm'
        run: dotnet publish tests/JvmBridge.IntegrationTests -c Release -r linux-arm --self-contained -o artifacts/tests/linux-arm
      - name: Cross-publish ARM32 with the .NET toolchain
        if: matrix.crossContainer && runner.arch == 'X64'
        env:
          CROSS_IMAGE: ${{ matrix.crossContainer }}
        run: |
          docker run --rm -v "$PWD:/repo" -v "$DOTNET_ROOT:/dotnet:ro" -w /repo \
            -e DOTNET_ROOT=/dotnet -e PATH=/dotnet:/usr/local/bin:/usr/bin:/bin \
            -e ROOTFS_DIR=/crossrootfs/arm -e PACKAGE_VERSION -e TARGET_RID -e Version -e VersionTimestamp \
            "$CROSS_IMAGE" \
            sh -ec '
              dotnet publish samples/HelloAgent -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -p:SysRoot="$ROOTFS_DIR" -p:LinkerFlavor=lld -p:ObjCopyName=llvm-objcopy -o "artifacts/agent/$TARGET_RID"
              dotnet publish samples/JavaHost -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -p:SysRoot="$ROOTFS_DIR" -p:LinkerFlavor=lld -p:ObjCopyName=llvm-objcopy -o "artifacts/host/$TARGET_RID"
              dotnet test tests/JvmBridge.IntegrationTests -c Release --filter FullyQualifiedName~ExportsAsync
            '
      # The cross image of .NET's toolchain exists for x64 only, and an arm64 runner runs ARM32 code natively but x64 code only under emulation. So on arm64 its ARM32
      # root file system is copied out of the image without running it, to the same path, since its symbolic links are absolute, and the runner's own clang and lld link
      # against it.
      - name: Cross-publish ARM32 on arm64 against the root file system of the .NET toolchain
        if: matrix.crossContainer && runner.arch == 'ARM64'
        env:
          CROSS_IMAGE: ${{ matrix.crossContainer }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y clang lld llvm
          docker pull --quiet --platform linux/amd64 "$CROSS_IMAGE"
          image="$(docker create --platform linux/amd64 "$CROSS_IMAGE")"
          rootfs=/crossrootfs/arm
          sudo mkdir -p /crossrootfs
          sudo docker cp "$image:$rootfs" /crossrootfs/
          docker rm "$image"
          dotnet publish samples/HelloAgent -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -p:SysRoot="$rootfs" -p:LinkerFlavor=lld -p:ObjCopyName=llvm-objcopy -o "artifacts/agent/$TARGET_RID"
          dotnet publish samples/JavaHost -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -p:SysRoot="$rootfs" -p:LinkerFlavor=lld -p:ObjCopyName=llvm-objcopy -o "artifacts/host/$TARGET_RID"
          dotnet test tests/JvmBridge.IntegrationTests -c Release --filter FullyQualifiedName~ExportsAsync
      - name: Publish and execute in the target container
        if: matrix.container
        env:
          SDK_IMAGE: ${{ matrix.container }}
          CROSS_BUILT: ${{ matrix.crossContainer != '' }}
        run: |
          # linux-arm runs on an arm64 runner, whose CPU runs ARM32 code natively, in the ARM32 variant of the image.
          platform=()
          if [[ "$TARGET_RID" == linux-arm ]]; then
            platform=(--platform linux/arm/v7)
          fi
          docker run --rm "${platform[@]}" -v "$PWD:/repo" -w /repo -e PACKAGE_VERSION -e TARGET_RID -e CROSS_BUILT -e Version -e VersionTimestamp \
            "$SDK_IMAGE" \
            sh -ec '
              if command -v apk >/dev/null; then
                apk add --no-cache clang build-base zlib-dev linux-headers
              else
                apt-get update -qq
                apt-get install -y clang build-essential zlib1g-dev
              fi
              if [ "$CROSS_BUILT" = true ]; then
                /repo/artifacts/tests/linux-arm/JvmBridge.IntegrationTests -xml "artifacts/results/$TARGET_RID/xunit.xml"
              else
                dotnet publish samples/HelloAgent -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -o "artifacts/agent/$TARGET_RID"
                dotnet publish samples/JavaHost -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -o "artifacts/host/$TARGET_RID"
                dotnet test tests/JvmBridge.IntegrationTests -c Release --logger trx --results-directory "artifacts/results/$TARGET_RID"
              fi
            '
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-${{ matrix.rid }}
          path: artifacts/results/
          if-no-files-found: error
      - name: Upload native examples
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: examples-${{ matrix.rid }}
          path: |
            artifacts/agent/
            artifacts/host/
          if-no-files-found: error
  # Java 6 and 7 from the same build as Java 8 to 26: samples/LegacyAgent (JavaRelease 6) is linked against the glibc 2.12 sysroot, runs on Zulu 6 and 7 and Temurin 8 and 21 on the
  # runner, and on Zulu 6 and 7 in CentOS 6. linux-x64 is the platform with pinned Java 6 and 7 JDKs that CI runs. It is outside the coverage gate, which holds the Java 8 to 26 grid.
  legacy:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      TARGET_RID: linux-x64
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.403
            11.0.100-rc.3.26522.148
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages
      - name: Prepare Linux native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld build-essential zlib1g-dev
      - name: Prepare the glibc 2.12 sysroot
        id: sysroot
        uses: void-community/actions/glibc-sysroot@4daadfeeba28a2b06f827a1af46facc2fe016d46 # main
        with:
          rid: linux-x64
          glibc: '2.12'
      - name: Publish the legacy agent and run it on Java 6, 7, 8 and 21
        shell: bash
        env:
          SYSROOT_PROPERTIES: ${{ steps.sysroot.outputs.properties }}
          JVMBRIDGE_LEGACY_GLIBC_IMAGE: centos:6@sha256:a93df2e96e07f56ea48f215425c6f1673ab922927894595bb5c0ee4c5a955133
        run: |
          # SYSROOT_PROPERTIES is meant to split into separate arguments.
          # shellcheck disable=SC2086
          dotnet publish samples/LegacyAgent -c Release -r linux-x64 --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" $SYSROOT_PROPERTIES -o artifacts/legacy-agent/linux-x64
          dotnet test tests/JvmBridge.IntegrationTests -c Release --filter "FullyQualifiedName~LegacyJavaTests" --logger trx --results-directory artifacts/results/legacy
      - name: Upload legacy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: legacy-results
          path: artifacts/results/legacy/
          if-no-files-found: error
  coverage:
    if: always()
    needs: agent
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.403
            11.0.100-rc.3.26522.148
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: results-*
          path: artifacts/results
          merge-multiple: true
      - name: Require every expected JVM cell
        run: dotnet build src/JvmBridge.Build -c Release -t:VerifyCoverage
