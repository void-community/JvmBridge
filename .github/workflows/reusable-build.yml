name: Build Workflow
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      timestamp:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      JvmBridgeVersion: ${{ inputs.version }}
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.404
            11.0.100-rc.3.26522.148
      # Packages carry the subjects of the commits in this push as their release notes. There are no tags to compare against, so the push range from the event is the base.
      - name: Write release notes from the commits in this push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p artifacts
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git log --no-merges --format='- %s (%h)' "$BEFORE..HEAD" | head -50 > artifacts/release-notes.txt
          else
            git log -1 --format='- %s (%h)' > artifacts/release-notes.txt
          fi
          cat artifacts/release-notes.txt
      - name: Restore binding generator
        run: dotnet tool restore --tool-manifest src/JvmBridge.Build/.config/dotnet-tools.json
      # clang and lld build the Windows x86 support of the package; clang and zlib also let the template test publish its agent with NativeAOT.
      - name: Prepare the native toolchains
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld mingw-w64-i686-dev zlib1g-dev
      - name: Pack the consumer artifact before restoring samples
        run: dotnet pack src/JvmBridge -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RepositoryCommit="$(git rev-parse HEAD)" -p:ReleaseNotesFile="$GITHUB_WORKSPACE/artifacts/release-notes.txt"
      - name: Pack the companion packages and the template that the build tests instantiate
        run: |
          dotnet pack src/JvmBridge.Testing -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RepositoryCommit="$(git rev-parse HEAD)" -p:ReleaseNotesFile="$GITHUB_WORKSPACE/artifacts/release-notes.txt"
          dotnet pack src/JvmBridge.Logging -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RepositoryCommit="$(git rev-parse HEAD)" -p:ReleaseNotesFile="$GITHUB_WORKSPACE/artifacts/release-notes.txt"
          dotnet pack src/JvmBridge.Tool -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RepositoryCommit="$(git rev-parse HEAD)" -p:ReleaseNotesFile="$GITHUB_WORKSPACE/artifacts/release-notes.txt"
          dotnet pack src/JvmBridge.Templates -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RepositoryCommit="$(git rev-parse HEAD)" -p:ReleaseNotesFile="$GITHUB_WORKSPACE/artifacts/release-notes.txt"
      - name: Restore solution
        run: dotnet restore JvmBridge.slnx
      - name: Verify generation, manifests, build, and unit tests
        run: |
          dotnet build src/JvmBridge.Build -c Release -t:VerifyGenerated
          dotnet build JvmBridge.slnx -c Release --no-restore
          dotnet test JvmBridge.slnx -c Release --no-build --no-restore
      - name: Compile portable Java fixtures with the pinned JDK
        run: dotnet build src/JvmBridge.Build -c Release -t:CompileFixtures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fixtures
          path: artifacts/fixtures
          if-no-files-found: error
