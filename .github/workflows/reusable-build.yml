name: Build Workflow
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      JvmBridgeVersion: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.401
            11.0.100-rc.1.26425.128
      - name: Restore binding generator
        run: dotnet tool restore --tool-manifest src/JvmBridge.Build/.config/dotnet-tools.json
      - name: Pack the consumer artifact before restoring samples
        run: dotnet pack src/JvmBridge -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RestoreLockedMode=true
      - name: Restore solution
        run: dotnet restore JvmBridge.slnx --locked-mode
      - name: Verify generation, manifests, build, and unit tests
        run: |
          dotnet msbuild build.proj -t:VerifyGenerated
          dotnet build JvmBridge.slnx -c Release --no-restore
          dotnet test JvmBridge.slnx -c Release --no-build --no-restore
      - name: Compile portable Java fixtures with the pinned JDK
        run: dotnet msbuild build.proj -t:CompileFixtures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fixtures
          path: artifacts/fixtures
          if-no-files-found: error
