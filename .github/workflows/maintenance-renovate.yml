name: Renovate Workflow
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    if: vars.AUTOMATION_PR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.AUTOMATION_TOKEN || github.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
      - name: Trigger validation for bot branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --json headRefName --jq '.[].headRefName | select(startswith("renovate/"))' | while read -r branch; do
            gh workflow run runnable-pr.yml --ref "$branch"
          done
