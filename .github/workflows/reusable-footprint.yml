name: Footprint
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      timestamp:
        type: string
        required: true
jobs:
  # Measures what an agent costs and reports it in the job summary. It runs beside the tests, not inside them, and publishing does not wait for it.
  # The agent targets of Compatibility.cs in src/JvmBridge.Build that run on the runner itself, not in a container or as x86; WorkflowMatrixTests fails when the two differ.
  footprint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
      TARGET_RID: ${{ matrix.rid }}
      Version: ${{ inputs.version }}
      VersionTimestamp: ${{ inputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.404
            11.0.100-rc.3.26522.148
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts/packages
      - name: Prepare Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang build-essential zlib1g-dev
      - name: Prepare Windows native toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $architecture = if ($env:TARGET_RID -eq 'win-arm64') { 'arm64' } else { 'x64' }
          cmd /c "`"$installation\VC\Auxiliary\Build\vcvarsall.bat`" $architecture && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Publish the minimal agent and measure its footprint
        shell: bash
        env:
          JVMBRIDGE_FOOTPRINT: '1'
        run: |
          dotnet publish samples/FootprintAgent -c Release -r "$TARGET_RID" --self-contained -p:PublishAot=true -p:JvmBridgeVersion="$PACKAGE_VERSION" -o "artifacts/footprint-agent/$TARGET_RID"
          dotnet test tests/JvmBridge.IntegrationTests -c Release -p:Platform=AnyCPU --filter FullyQualifiedName~FootprintTests
      - name: Upload footprint measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: footprint-${{ matrix.rid }}
          path: artifacts/footprint/
          if-no-files-found: ignore
