name: Automation Reconciliation
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate main after bot merges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          count=$(gh run list --workflow runnable-commit.yml --commit "$sha" --json databaseId --jq length)
          if [[ "$count" == 0 ]]; then gh workflow run runnable-commit.yml --ref main; fi
