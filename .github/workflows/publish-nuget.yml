name: NuGet Workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tag }}
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/reusable-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ inputs.tag }}
  test:
    needs: [version, build]
    uses: ./.github/workflows/reusable-test.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ inputs.tag }}
  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: artifacts/packages
      - name: Publish verified package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY"
          dotnet nuget push artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
