name: JDK Maintenance
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: jdk-maintenance
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.401
            11.0.100-rc.1.26425.128
      - name: Freeze timestamp version for package-consumer validation
        run: |
          version_timestamp="$(date -u '+%y %m %d %H %M %S')"
          package_version="$(dotnet msbuild src/JvmBridge/JvmBridge.csproj -getProperty:PackageVersion "-p:VersionTimestamp=$version_timestamp")"
          echo "VersionTimestamp=$version_timestamp" >> "$GITHUB_ENV"
          echo "Version=$package_version" >> "$GITHUB_ENV"
          echo "JvmBridgeVersion=$package_version" >> "$GITHUB_ENV"
      - run: dotnet tool restore --tool-manifest src/JvmBridge.Build/.config/dotnet-tools.json
      - run: dotnet restore src/JvmBridge.Maintenance --locked-mode
      - name: Update pinned releases, bindings, and support inventory
        run: |
          dotnet run --project src/JvmBridge.Maintenance --no-restore -- update
          dotnet build src/JvmBridge.Build -c Release -t:Generate -p:RestoreLockedMode=true
      - name: Verify regeneration and unit tests
        run: |
          dotnet build src/JvmBridge.Build -c Release -t:VerifyGenerated -p:RestoreLockedMode=true
          dotnet pack src/JvmBridge -c Release -o artifacts/packages -p:Version="$JvmBridgeVersion" -p:RestoreLockedMode=true
          dotnet restore JvmBridge.slnx --locked-mode
          dotnet build JvmBridge.slnx -c Release --no-restore
          dotnet test JvmBridge.slnx -c Release --no-build --no-restore
      - name: Save generated update for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jdk-update
          path: |
            src/JvmBridge.Build/headers/
            src/JvmBridge.Build/compatibility.json
            src/JvmBridge.Build/jdks.lock.json
            src/JvmBridge/Native/Generated/
            docs/compatibility.md
      - name: Create update PR and trigger real JVM validation
        if: vars.AUTOMATION_PR_ENABLED == 'true'
        shell: bash
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch=automation/jdk-updates
          git checkout -B "$branch"
          git add src/JvmBridge.Build src/JvmBridge/Native/Generated docs/compatibility.md
          git commit -m 'deps(jdk): ⬆️ refreshed generated JVM bindings and pinned runtimes' -m 'Observable behavior: updated the JVM compatibility inventory and generated declarations; runtime behavior is verified by the complete native-agent matrix.'
          git push --force-with-lease origin "$branch"
          if ! gh pr list --head "$branch" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create --head "$branch" --title 'deps(jdk): ⬆️ refreshed generated JVM bindings and pinned runtimes' --body-file .github/jdk-update-body.md
          fi
          gh workflow run runnable-pr.yml --ref "$branch"
          # New platforms and public API changes need human review. Routine archive
          # updates can merge after the protected required check succeeds.
          if git diff HEAD^ HEAD --quiet -- src/JvmBridge/Native/Generated/Bindings.g.cs src/JvmBridge.Build/compatibility.json; then
            gh pr merge "$branch" --auto --rebase
          fi
